name: A11y Build

# Debug APK for testing the accessibility layer with a screen reader.
# Debug is used on purpose: it is signed with the debug key, so it installs on a device without
# setting up a keystore, and it does not need a release tag.

on:
  push:
    branches:
      - 'a11y/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleStandardDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mpvex-a11y-debug-${{ github.sha }}
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
          retention-days: 14
